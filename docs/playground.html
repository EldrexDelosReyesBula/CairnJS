<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CairnJS — Interactive Live Playground &amp; Code Sandbox</title>
    <meta name="description" content="Online interactive playground for CairnJS. Edit reactive code live with full Monaco Editor IntelliSense, syntax coloring, collapsible code blocks, and instant zero-build execution.">
    <meta name="keywords" content="cairnjs playground, online javascript editor, reactive sandbox, signals playground, monaco editor intellisense">
    <meta name="author" content="Eldrex Delos Reyes Bula">
    <link rel="canonical" href="https://cairnjs.vercel.app/docs/playground.html">

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="./assets/cairn-official-logo.svg">
    <link rel="alternate icon" type="image/png" href="./assets/cairn-official-logo.png">
    <link rel="apple-touch-icon" href="./assets/cairn-official-logo.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cairnjs.vercel.app/docs/playground.html">
    <meta property="og:title" content="CairnJS — Interactive Live Playground">
    <meta property="og:description" content="Edit reactive CairnJS code live with full Monaco IntelliSense, code coloring, and instant preview.">
    <meta property="og:image" content="https://cairnjs.vercel.app/docs/assets/cairn-official-logo.png">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CairnJS — Live Playground">
    <meta name="twitter:description" content="Test CairnJS signals, components, and animations with live Monaco IntelliSense.">
    <meta name="twitter:image" content="https://cairnjs.vercel.app/docs/assets/cairn-official-logo.png">

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CairnJS Live Playground",
      "url": "https://cairnjs.vercel.app/docs/playground.html",
      "applicationCategory": "DeveloperApplication",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "Interactive playground for experimenting with CairnJS reactive components, signals, and spring physics."
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root,
        [data-theme="dark"] {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-card: #1e293b;
            --surface-hover: #334155;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --editor-bg: #0f172a;
            --console-bg: #090d16;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --editor-bg: #ffffff;
            --console-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Navbar */
        .playground-header {
            min-height: 56px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
            z-index: 10;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text);
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.15rem;
        }

        .brand-badge {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .template-select-wrap {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .template-select {
            background: var(--surface-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: var(--font-sans);
            cursor: pointer;
            outline: none;
            max-width: 260px;
        }

        .template-select:focus {
            border-color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-left: auto;
        }

        .btn {
            background: var(--surface-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.825rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border: none;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        /* Mobile Segmented View Switcher (< 900px) */
        .mobile-view-tabs {
            display: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.35rem 0.75rem;
            gap: 0.5rem;
            justify-content: center;
        }

        .mobile-tab-btn {
            flex: 1;
            padding: 0.45rem 0.5rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }

        .mobile-tab-btn.active {
            background: var(--surface-card);
            border-color: var(--border);
            color: var(--accent);
        }

        /* Workspace Grid */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .playground-header {
                height: auto;
                padding: 0.6rem 0.75rem;
            }

            .mobile-view-tabs {
                display: flex;
            }

            .workspace {
                grid-template-columns: 1fr;
                height: calc(100vh - 102px);
            }

            .editor-pane,
            .preview-pane,
            .console-pane-wrapper {
                display: none !important;
            }

            body[data-mobile-tab="editor"] .editor-pane {
                display: flex !important;
                border-right: none;
            }

            body[data-mobile-tab="preview"] .preview-pane {
                display: flex !important;
            }

            body[data-mobile-tab="preview"] .console-pane-wrapper {
                display: flex !important;
            }

            body[data-mobile-tab="console"] .preview-pane {
                display: flex !important;
            }

            body[data-mobile-tab="console"] .preview-frame-wrap {
                display: none !important;
            }

            body[data-mobile-tab="console"] .console-pane-wrapper {
                display: flex !important;
                flex: 1 !important;
                height: 100% !important;
            }

            .template-select {
                max-width: 170px;
                font-size: 0.775rem;
            }

            .btn span.btn-label {
                display: none;
            }
        }

        /* Left Editor Pane */
        .editor-pane {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--editor-bg);
            height: 100%;
            overflow: hidden;
        }

        .pane-toolbar {
            height: 38px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .code-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: var(--text);
            border: none;
            outline: none;
            padding: 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            white-space: pre;
            tab-size: 4;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Right Preview Pane */
        .preview-pane {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
        }

        .preview-frame-wrap {
            flex: 1;
            position: relative;
            background: var(--bg);
            overflow: hidden;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg);
        }

        /* Console Output */
        .console-pane-wrapper {
            height: 160px;
            background: var(--console-bg);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .console-header {
            height: 32px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.85rem;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .console-logs {
            flex: 1;
            padding: 0.5rem 0.85rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            -webkit-overflow-scrolling: touch;
        }

        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.2rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.8rem;
        }

        .log-entry.log {
            color: var(--text);
        }

        .log-entry.warn {
            color: #f59e0b;
        }

        .log-entry.error {
            color: #ef4444;
        }

        .log-entry.info {
            color: #38bdf8;
        }

        /* Toast */
        .toast-popup {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--surface-card);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .toast-popup.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body data-mobile-tab="editor">

    <!-- Top Header -->
    <header class="playground-header">
        <div class="header-left">
            <a href="./index.html" class="brand-link" title="Return to CairnJS Documentation">
                <img src="./assets/cairn-official-logo.png" alt="CairnJS Logo"
                    style="width: 26px; height: 26px; object-fit: contain;"
                    onerror="this.src='./assets/cairn-logo.png'">
                <span>CairnJS Playground</span>
            </a>

            <div class="template-select-wrap">
                <select id="template-picker" class="template-select" aria-label="Select Template Example">
                    <optgroup label="Reactivity & Fundamentals">
                        <option value="counter">1. Reactive Counter & Multiplier</option>
                        <option value="todos">2. Dynamic Filterable Todo App</option>
                        <option value="forms">3. Declarative Form Validation</option>
                    </optgroup>
                    <optgroup label="Overlays & Navigation">
                        <option value="overlays">4. Modals, Drawers & Toast Hub</option>
                        <option value="command">5. Command Palette (Cmd+K)</option>
                        <option value="stepper">6. Multi-Step Wizard Stepper</option>
                        <option value="contextmenu">7. Custom Context Menu</option>
                    </optgroup>
                    <optgroup label="Data Display & Graphics">
                        <option value="datatable">8. Interactive DataTable Grid</option>
                        <option value="accordion">9. Collapsible Accordion FAQ</option>
                        <option value="motion">10. Spring Physics Kinematics</option>
                        <option value="canvas">11. 2D Canvas Particle Engine</option>
                        <option value="i18n">12. Multi-Language i18n & RTL</option>
                        <option value="tabs">13. Interactive Tabs Container</option>
                        <option value="rating">14. Star Rating & Feedback</option>
                        <option value="posts">15. Social Media & Image Post Feed</option>
                        <option value="store">16. E-Commerce Store & Cart</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="header-right">
            <button id="btn-run" class="btn btn-primary" title="Execute Code (Cmd+Enter / Ctrl+Enter)">
                <i class="fa-solid fa-play"></i> <span class="btn-label">Run</span>
            </button>
            <button id="btn-reset" class="btn" title="Reset template">
                <i class="fa-solid fa-rotate-left"></i> <span class="btn-label">Reset</span>
            </button>
            <button id="btn-copy" class="btn" title="Copy code">
                <i class="fa-regular fa-copy"></i> <span class="btn-label">Copy</span>
            </button>
            <button id="btn-theme" class="btn" title="Toggle Dark/Light Mode">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <a href="../examples/index.html" class="btn" title="All Examples Gallery">
                <i class="fa-solid fa-cubes"></i> <span class="btn-label">Examples</span>
            </a>
            <a href="./index.html" class="btn" title="Docs Guide">
                <i class="fa-solid fa-book-open"></i> <span class="btn-label">Docs</span>
            </a>
        </div>
    </header>

    <!-- Mobile View Tabs (< 900px) -->
    <nav class="mobile-view-tabs" aria-label="Mobile Playground Switcher">
        <button class="mobile-tab-btn active" data-tab="editor"><i class="fa-solid fa-code"></i> Code Editor</button>
        <button class="mobile-tab-btn" data-tab="preview"><i class="fa-solid fa-play"></i> Live Preview</button>
        <button class="mobile-tab-btn" data-tab="console"><i class="fa-solid fa-terminal"></i> Console</button>
    </nav>

    <!-- Workspace -->
    <main class="workspace">
        <!-- Editor Pane -->
        <section class="editor-pane">
            <div class="pane-toolbar">
                <span><i class="fa-brands fa-js" style="color: #f7df1e; margin-right: 0.4rem;"></i> Live Code Editor
                    (ESM)</span>
                <span style="font-size: 0.7rem; font-weight: 500; text-transform: none;">Auto-runs on edits</span>
            </div>
            <div class="editor-container">
                <div id="monaco-editor-container" style="width: 100%; height: 100%;"></div>
                <textarea id="code-editor" class="code-textarea" spellcheck="false" autocomplete="off"
                    placeholder="Write CairnJS code here..." style="display: none;"></textarea>
            </div>
        </section>

        <!-- Preview & Console Pane -->
        <section class="preview-pane">
            <div class="pane-toolbar">
                <span><i class="fa-solid fa-display" style="color: var(--accent); margin-right: 0.4rem;"></i> Live
                    Output</span>
                <span id="runtime-status" style="color: #10b981; font-size: 0.7rem; text-transform: none;"><i
                        class="fa-solid fa-circle" style="font-size: 0.5rem;"></i> Ready</span>
            </div>
            <div class="preview-frame-wrap">
                <iframe id="preview-frame" class="preview-frame"
                    sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
            </div>

            <!-- Console Output -->
            <div class="console-pane-wrapper">
                <div class="console-header">
                    <span><i class="fa-solid fa-terminal" style="margin-right: 0.4rem;"></i> Console Output</span>
                    <button id="btn-clear-console"
                        style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.7rem;"
                        title="Clear console">Clear</button>
                </div>
                <div id="console-logs" class="console-logs">
                    <div class="log-entry info"><i class="fa-solid fa-info-circle"></i> CairnJS runtime ready.</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-popup">
        <i class="fa-solid fa-circle-check" style="color: #10b981;"></i>
        <span id="toast-msg">Action completed!</span>
    </div>

    <!-- External Module Engine -->
    <script type="module" src="./playground.js"></script>
</body>

</html>
