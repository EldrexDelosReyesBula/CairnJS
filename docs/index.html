    <style>
        :root, [data-theme="dark"] {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-card: #1e293b;
            --surface-hover: #334155;
            --border: rgba(255, 255, 255, 0.08);
            --border-active: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-purple: #818cf8;
            --header-bg: rgba(11, 15, 25, 0.85);
            --code-bg: #020617;
            --code-header-bg: #0f172a;
            --sidebar-bg: #0b0f19;
            --drawer-bg: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-shadow: 0 20px 30px rgba(0, 0, 0, 0.35);
            --btn-sec-bg: rgba(30, 41, 59, 0.8);
            --btn-sec-text: #f1f5f9;
            --btn-sec-border: rgba(255, 255, 255, 0.1);
            --search-bg: rgba(30, 41, 59, 0.4);
            --toggle-track: #1e293b;
            --toggle-thumb: #0b0f19;
            --toggle-border: rgba(255, 255, 255, 0.2);
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --surface: #f8fafc;
            --surface-card: #ffffff;
            --surface-hover: #f1f5f9;
            --border: rgba(0, 0, 0, 0.08);
            --border-active: #0284c7;
            --text: #0f172a;
            --text-muted: #475569;
            --accent: #0284c7;
            --accent-purple: #6366f1;
            --header-bg: rgba(255, 255, 255, 0.95);
            --code-bg: #0f172a;
            --code-header-bg: #1e293b;
            --sidebar-bg: #ffffff;
            --drawer-bg: #ffffff;
            --card-bg: #ffffff;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.06), 0 4px 10px rgba(0, 0, 0, 0.03);
            --btn-sec-bg: #f8fafc;
            --btn-sec-text: #0f172a;
            --btn-sec-border: rgba(0, 0, 0, 0.12);
            --search-bg: #f1f5f9;
            --toggle-track: #e2e8f0;
            --toggle-thumb: #ffffff;
            --toggle-border: rgba(0, 0, 0, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Accessibility Skip Link */
        .skip-link {
            position: absolute;
            top: -50px;
            left: 1rem;
            background: var(--accent);
            color: #fff;
            padding: 0.5rem 1rem;
            font-weight: 700;
            border-radius: 0.375rem;
            z-index: 1000;
            text-decoration: none;
            transition: top 0.2s ease;
        }
        .skip-link:focus {
            top: 1rem;
        }

        /* Keyboard Focus Outlines */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        pre, code {
            font-family: var(--font-mono);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        #docs-root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Animated Gradient Text */
        .cairn-gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 25%, #c084fc 50%, #f472b6 75%, #38bdf8 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: cairnGradientShift 8s ease infinite;
        }

        @keyframes cairnGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* VitePress Hero Styling */
        .cairn-hero-section {
            position: relative;
            padding: 5rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Animated Glowing Aura Behind Logo */
        .cairn-hero-glow {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(129, 140, 248, 0.22) 35%, rgba(192, 132, 252, 0.12) 55%, transparent 75%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
            animation: cairnGlowPulse 7s ease-in-out infinite;
            will-change: transform, opacity;
        }

        @keyframes cairnGlowPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.75;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.18);
                opacity: 1;
                filter: blur(58px);
            }
        }

        /* Floating Hero Logo */
        .cairn-hero-badge {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            background: transparent;
            border: none;
            box-shadow: none;
            filter: drop-shadow(0 15px 25px rgba(56, 189, 248, 0.3));
            animation: cairnLogoFloat 4.5s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes cairnLogoFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .cairn-hero-title {
            position: relative;
            z-index: 1;
            font-family: var(--font-heading);
            font-size: 3.75rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.25rem;
            color: var(--text);
        }

        .cairn-hero-subtitle {
            position: relative;
            z-index: 1;
            font-size: 1.35rem;
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .cairn-hero-actions {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 1rem;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cairn-btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: white;
            padding: 0.85rem 1.85rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .cairn-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.45);
        }

        .cairn-btn-secondary {
            background: var(--btn-sec-bg);
            color: var(--btn-sec-text);
            padding: 0.85rem 1.85rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border: 1px solid var(--btn-sec-border);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .cairn-btn-secondary:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* 4-Card Feature Grid */
        .cairn-feature-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .cairn-feature-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.75rem;
            text-align: left;
            transition: all 0.25s ease;
            box-shadow: var(--card-shadow);
        }

        .cairn-feature-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .cairn-feature-icon {
            width: 44px;
            height: 44px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 1.25rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .cairn-feature-card h3 {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .cairn-feature-card p {
            font-size: 0.925rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Clean Markdown Article Styling */
        .markdown-body h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 1.25rem;
            line-height: 1.25;
            color: var(--text);
        }

        .markdown-body h2 {
            font-family: var(--font-heading);
            font-size: 1.55rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            letter-spacing: -0.015em;
            scroll-margin-top: 80px;
        }

        .markdown-body h3 {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.75rem;
            margin-bottom: 0.65rem;
            color: var(--text);
            scroll-margin-top: 80px;
        }

        .markdown-body p {
            margin-bottom: 1.25rem;
            color: var(--text);
            font-size: 1.025rem;
            line-height: 1.75;
        }

        .markdown-body ul, .markdown-body ol {
            margin-left: 1.25rem;
            margin-bottom: 1.25rem;
            color: var(--text);
        }

        .markdown-body li {
            margin-bottom: 0.4rem;
            font-size: 1rem;
            line-height: 1.65;
        }

        /* Clean Code Block Container with Top Header */
        .markdown-body .code-block-wrapper {
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .markdown-body .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.85rem;
            background: #0f172a;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: #94a3b8;
            font-family: var(--font-mono);
        }

        .markdown-body .copy-code-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: #38bdf8;
            padding: 0.2rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.15s ease;
        }

        .markdown-body .copy-code-btn:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        .markdown-body pre {
            background: transparent;
            padding: 1rem 1.15rem;
            border: none;
            overflow-x: auto;
            margin-bottom: 0;
        }

        .markdown-body code {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: #f8fafc;
            border: none;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid var(--border);
            display: block;
            overflow-x: auto;
        }

        .markdown-body th, .markdown-body td {
            padding: 0.6rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .markdown-body th {
            background: #0f172a;
            font-family: var(--font-heading);
            font-weight: 600;
            color: #f8fafc;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .markdown-body blockquote {
            border-left: 3px solid #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 0 0.375rem 0.375rem 0;
            margin-bottom: 1.25rem;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .markdown-body a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .markdown-body a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* Responsive Breakpoints & Fluid Adaptability */
        @media (max-width: 1150px) {
            .cairn-hero-section {
                padding: 4rem 1.5rem 3.5rem;
            }
            .cairn-feature-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.25rem;
            }
        }

        @media (max-width: 768px) {
            .cairn-hero-section {
                padding: 3rem 1rem 2.5rem;
            }
            .cairn-hero-glow {
                width: 320px;
                height: 320px;
                filter: blur(40px);
            }
            .cairn-hero-title {
                font-size: clamp(2rem, 7vw, 2.75rem);
                line-height: 1.15;
            }
            .cairn-hero-subtitle {
                font-size: 1.05rem;
                margin-bottom: 2rem;
            }
            .cairn-hero-actions {
                flex-direction: column;
                align-items: stretch;
                max-width: 320px;
                margin: 0 auto 2.5rem;
                gap: 0.75rem;
            }
            .cairn-btn-primary, .cairn-btn-secondary {
                width: 100%;
                text-align: center;
                justify-content: center;
                padding: 0.75rem 1.25rem;
                font-size: 0.95rem;
            }
            .cairn-feature-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .cairn-feature-card {
                padding: 1.35rem;
            }
            .markdown-body h1 {
                font-size: 1.75rem;
                line-height: 1.25;
            }
            .markdown-body h2 {
                font-size: 1.35rem;
                margin-top: 1.75rem;
            }
            .markdown-body h3 {
                font-size: 1.1rem;
            }
            .markdown-body p, .markdown-body li {
                font-size: 0.925rem;
                line-height: 1.6;
            }
            .markdown-body pre {
                padding: 0.75rem 0.85rem;
                font-size: 0.825rem;
                -webkit-overflow-scrolling: touch;
            }
            .markdown-body table {
                font-size: 0.825rem;
                -webkit-overflow-scrolling: touch;
            }
            .markdown-body th, .markdown-body td {
                padding: 0.5rem 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .cairn-hero-section {
                padding: 2rem 0.75rem 2rem;
            }
            .cairn-hero-title {
                font-size: 1.85rem;
            }
            .cairn-hero-subtitle {
                font-size: 0.925rem;
            }
            .cairn-feature-card h3 {
                font-size: 1.05rem;
            }
            .cairn-feature-card p {
                font-size: 0.875rem;
            }
            .markdown-body h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

    <div id="docs-root"></div>

    <script type="module" src="./app.js"></script>
</body>
