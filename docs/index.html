<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairn — Framework-Agnostic UI Component Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-card: #1e293b;
            --surface-hover: #334155;
            --border: rgba(255, 255, 255, 0.08);
            --border-active: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-purple: #818cf8;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        pre, code {
            font-family: var(--font-mono);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        #docs-root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* VitePress Gradient Text */
        .cairn-gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* VitePress Hero Styling */
        .cairn-hero-section {
            position: relative;
            padding: 5rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .cairn-hero-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(129, 140, 248, 0.15) 50%, transparent 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        .cairn-hero-badge {
            position: relative;
            z-index: 1;
            width: 120px;
            height: 120px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .cairn-hero-title {
            position: relative;
            z-index: 1;
            font-family: var(--font-heading);
            font-size: 3.75rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.25rem;
        }

        .cairn-hero-subtitle {
            position: relative;
            z-index: 1;
            font-size: 1.35rem;
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .cairn-hero-actions {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 1rem;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cairn-btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: white;
            padding: 0.85rem 1.85rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .cairn-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.45);
        }

        .cairn-btn-secondary {
            background: rgba(30, 41, 59, 0.8);
            color: #f1f5f9;
            padding: 0.85rem 1.85rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .cairn-btn-secondary:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        /* 4-Card Feature Grid */
        .cairn-feature-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .cairn-feature-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.75rem;
            text-align: left;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .cairn-feature-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .cairn-feature-icon {
            width: 44px;
            height: 44px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 1.25rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .cairn-feature-card h3 {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }

        .cairn-feature-card p {
            font-size: 0.925rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Clean Markdown Article Styling */
        .markdown-body h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 1.25rem;
            line-height: 1.25;
            color: var(--text);
        }

        .markdown-body h2 {
            font-family: var(--font-heading);
            font-size: 1.55rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border);
            color: #f1f5f9;
            letter-spacing: -0.015em;
            scroll-margin-top: 80px;
        }

        .markdown-body h3 {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.75rem;
            margin-bottom: 0.65rem;
            color: #e2e8f0;
            scroll-margin-top: 80px;
        }

        .markdown-body p {
            margin-bottom: 1.25rem;
            color: #cbd5e1;
            font-size: 1.025rem;
            line-height: 1.75;
        }

        .markdown-body ul, .markdown-body ol {
            margin-left: 1.25rem;
            margin-bottom: 1.25rem;
            color: #cbd5e1;
        }

        .markdown-body li {
            margin-bottom: 0.4rem;
            font-size: 1rem;
            line-height: 1.65;
        }

        /* Clean Code Block Container with Top Header */
        .markdown-body .code-block-wrapper {
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .markdown-body .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.85rem;
            background: #0f172a;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: #94a3b8;
            font-family: var(--font-mono);
        }

        .markdown-body .copy-code-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: #38bdf8;
            padding: 0.2rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.15s ease;
        }

        .markdown-body .copy-code-btn:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        .markdown-body pre {
            background: transparent;
            padding: 1rem 1.15rem;
            border: none;
            overflow-x: auto;
            margin-bottom: 0;
        }

        .markdown-body code {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: #f8fafc;
            border: none;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid var(--border);
            display: block;
            overflow-x: auto;
        }

        .markdown-body th, .markdown-body td {
            padding: 0.6rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .markdown-body th {
            background: #0f172a;
            font-family: var(--font-heading);
            font-weight: 600;
            color: #f8fafc;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .markdown-body blockquote {
            border-left: 3px solid #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 0 0.375rem 0.375rem 0;
            margin-bottom: 1.25rem;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .markdown-body a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .markdown-body a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .cairn-hero-title { font-size: 2.5rem; }
            .cairn-hero-subtitle { font-size: 1.1rem; }
            .markdown-body h1 { font-size: 1.75rem; }
            .markdown-body h2 { font-size: 1.3rem; }
            .markdown-body p, .markdown-body li { font-size: 0.925rem; }
        }
    </style>
</head>
<body>
    <div id="docs-root"></div>

    <script type="module" src="./app.js"></script>
</body>
</html>
