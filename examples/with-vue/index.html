<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairn — Vue Integration Example</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0b132b; color: #edf2f4; padding: 2rem; }
        .box { background: #1c2541; padding: 2rem; border-radius: 0.75rem; max-width: 450px; margin: 0 auto; }
        button { background: #10b981; color: white; border: 0; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app" class="box">
        <h1>Vue 3 + Cairn Demo</h1>
        <p>Cairn components mounted dynamically inside Vue template ref.</p>
        <div ref="cairnTarget"></div>
    </div>

    <script type="module">
        import { cairn } from '../../src/index.js';

        const { createApp, ref, onMounted } = Vue;

        const CairnWidget = cairn.component((props) => {
            const likes = cairn.state(props.likes || 0);
            return cairn.div({ style: { marginTop: '1rem', padding: '1rem', border: '1px dashed #3a506b', borderRadius: '0.5rem' } },
                cairn.h3('Cairn Reactive Widget'),
                cairn.p(() => `Likes: ${likes.value}`),
                cairn.button('Like 👍', { onclick: () => likes.value++ })
            );
        });

        createApp({
            setup() {
                const cairnTarget = ref(null);

                onMounted(() => {
                    cairn.mount(cairnTarget, CairnWidget({ likes: 100 }));
                });

                return { cairnTarget };
            }
        }).mount('#app');
    </script>
</body>
</html>
