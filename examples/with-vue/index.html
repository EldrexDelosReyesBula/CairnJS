<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cairn — Vue 3 Integration Example</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        @font-face {
            font-family: 'Cairn';
            src: url('../../cairn-font/Cairn-Regular.woff2') format('woff2'),
                 url('../../cairn-font/Cairn-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        h1, h2, h3, .vue-badge, button {
            font-family: 'Cairn', system-ui, -apple-system, sans-serif;
        }
        .vue-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1.25rem;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .vue-badge {
            display: inline-block;
            background: rgba(66, 184, 131, 0.15);
            color: #42b883;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        .cairn-slot {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: #1e293b;
            border: 1px dashed rgba(66, 184, 131, 0.4);
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>
    <div id="app" class="vue-card">
        <span class="vue-badge">Vue 3 Shell + Cairn Widget</span>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">Vue 3 + Cairn Demo</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem;">
            Cairn components mount seamlessly inside Vue template refs without Virtual DOM conflicts.
        </p>
        <button style="background: #334155; color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600;" @click="vueCount++">
            Vue Shell Counter: {{ vueCount }}
        </button>
        <div ref="cairnTarget" class="cairn-slot"></div>
    </div>

    <script type="module">
        import { cairn, component, state, div, h3, p, button, mount } from '../../src/index.js';

        const { createApp, ref, onMounted } = Vue;

        const CairnWidget = component((props) => {
            const likes = state(props.likes || 100);
            return div(
                h3('⚡ Cairn Reactive Sub-tree', { style: { fontSize: '1rem', color: '#42b883', marginBottom: '0.5rem' } }),
                p(() => `Widget Likes: ${likes.value}`, { style: { fontSize: '1.25rem', fontWeight: '700', marginBottom: '0.75rem' } }),
                button('Like 👍', {
                    style: {
                        background: 'linear-gradient(135deg, #10b981, #059669)',
                        color: 'white',
                        border: 'none',
                        padding: '0.5rem 1rem',
                        borderRadius: '0.375rem',
                        cursor: 'pointer',
                        fontWeight: '600'
                    },
                    onclick: () => likes.value++
                })
            );
        });

        createApp({
            setup() {
                const cairnTarget = ref(null);
                const vueCount = ref(0);

                onMounted(() => {
                    mount(cairnTarget.value, CairnWidget({ likes: 250 }));
                });

                return { cairnTarget, vueCount };
            }
        }).mount('#app');
    </script>
</body>
</html>
