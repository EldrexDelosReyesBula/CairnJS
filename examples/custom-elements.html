<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CairnJS — Native Web Components (Custom Elements)</title>
    <style>
        @font-face {
            font-family: 'Cairn';
            src: url('../cairn-font/Cairn-Regular.woff2') format('woff2'),
                 url('../cairn-font/Cairn-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        h1, h2, h3, .badge, button {
            font-family: 'Cairn', system-ui, -apple-system, sans-serif;
        }
        .demo-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1.25rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        .custom-elem-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: #1e293b;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="demo-card">
        <span class="badge">Standard W3C Custom Element</span>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">Native Web Component</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.25rem;">
            Cairn components can be compiled into standard custom HTML tags usable in ANY framework or static HTML.
        </p>

        <!-- Custom Element Tag -->
        <div class="custom-elem-box">
            <cairn-counter initial="10"></cairn-counter>
        </div>
    </div>

    <script type="module">
        import { state, computed, div, h3, p, button, defineCustomElement } from '../src/index.js';

        // Define standard Cairn component
        const CounterWidget = (props) => {
            const count = state(parseInt(props.initial || 0, 10));
            const double = computed(() => count.value * 2);

            return div(
                h3('⚡ &lt;cairn-counter&gt; Component', { style: { fontSize: '1rem', color: '#eab308', marginBottom: '0.5rem' } }),
                p(() => `Value: ${count.value} (Double: ${double.value})`, { style: { fontSize: '1.15rem', fontWeight: 700, marginBottom: '0.75rem' } }),
                button('Increment +', {
                    style: {
                        background: 'linear-gradient(135deg, #eab308, #ca8a04)',
                        color: '#000',
                        border: 'none',
                        padding: '0.55rem 1.25rem',
                        borderRadius: '0.375rem',
                        cursor: 'pointer',
                        fontWeight: '700'
                    },
                    onclick: () => count.value++
                })
            );
        };

        // Register as native W3C Custom Element: <cairn-counter>
        defineCustomElement('cairn-counter', CounterWidget, ['initial']);
    </script>
</body>
</html>
