<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CairnJS — Reactive Counter Example</title>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="./assets/cairn-official-logo.svg">
    <link rel="alternate icon" type="image/png" href="./assets/cairn-official-logo.png">
    <link rel="apple-touch-icon" href="./assets/cairn-official-logo.png">
    <style>
        @font-face {
            font-family: 'Cairn';
            src: url('../cairn-font/Cairn-Regular.woff2') format('woff2'),
                url('../cairn-font/Cairn-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        h1,
        h2,
        h3,
        .btn {
            font-family: 'Cairn', system-ui, -apple-system, sans-serif;
        }

        .counter-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1.25rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 380px;
            width: 100%;
        }

        .count-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #38bdf8;
            margin: 1rem 0;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1;
            min-width: 70px;
        }

        .btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            border: none;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .stats {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1rem;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script type="module">
        import { state, computed, div, span, h2, p, button, mount } from '../src/index.js';

        const count = state(0);
        const doubleCount = computed(() => count.value * 2);
        const isEven = computed(() => count.value % 2 === 0);

        const App = div({ class: 'counter-card' },
            h2('CairnJS Counter'),
            p({ style: { color: '#94a3b8', fontSize: '0.9rem' } }, 'Zero-Dependency Signals Engine'),
            div({ class: 'count-display' }, () => count.value),
            div({ class: 'btn-group' },
                button('-', {
                    class: 'btn',
                    onclick: () => count.value--
                }),
                button('Reset', {
                    class: 'btn',
                    onclick: () => count.value = 0
                }),
                button('+', {
                    class: 'btn btn-primary',
                    onclick: () => count.value++
                })
            ),
            div({ class: 'stats' },
                p(() => `Double: ${doubleCount.value}`),
                p(() => `Status: ${isEven.value ? 'Even' : 'Odd'}`)
            )
        );

        mount('#app', App);
    </script>
</body>

</html>
