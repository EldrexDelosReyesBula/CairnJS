<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairn — Counter Example</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: grid; place-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { background: #6366f1; color: white; border: none; padding: 0.75rem 1.5rem; font-weight: 600; border-radius: 0.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { state, button, div, mount } from '../src/index.js';

        let count = state(0);

        let app = div({ class: 'card' },
            button(
                () => `Clicked ${count.value} times`,
                { onclick: () => count.value++ }
            )
        );

        mount("#app", app);
    </script>
</body>
</html>
