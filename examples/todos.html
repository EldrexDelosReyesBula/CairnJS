<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairn — Todo App Example</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: grid; place-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 0.5rem; border-radius: 0.375rem; width: 65%; margin-right: 0.5rem; }
        button { background: #10b981; color: white; border: none; padding: 0.55rem 1rem; font-weight: 600; border-radius: 0.375rem; cursor: pointer; }
        ul { list-style: none; padding: 0; margin-top: 1.5rem; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
        .del-btn { background: #ef4444; padding: 0.2rem 0.5rem; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { state, input, button, ul, li, div, h2, mount } from '../src/index.js';

        let todos = state(["Learn Cairn", "Build components"]);
        let text = state("");

        let app = div({ class: 'card' },
            h2("My Todo List"),
            input({ value: text, oninput: (e) => text.value = e.target.value }),
            button("Add", { onclick: () => {
                if (!text.value.trim()) return;
                todos.value = [...todos.value, text.value.trim()];
                text.value = "";
            }}),
            ul(() => todos.value.map((todo, i) =>
                li(
                    todo,
                    button("×", {
                        class: "del-btn",
                        onclick: () => {
                            todos.value = todos.value.filter((_, j) => j !== i);
                        }
                    })
                )
            ))
        );

        mount("#app", app);
    </script>
</body>
</html>
