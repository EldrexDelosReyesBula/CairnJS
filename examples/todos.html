<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CairnJS — Reactive Todo App</title>
    <style>
        @font-face {
            font-family: 'Cairn';
            src: url('../cairn-font/Cairn-Regular.woff2') format('woff2'),
                 url('../cairn-font/Cairn-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        h1, h2, h3, button, .filter-btn {
            font-family: 'Cairn', system-ui, -apple-system, sans-serif;
        }
        .todo-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1.25rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .input-row {
            display: flex;
            gap: 0.5rem;
            margin: 1.25rem 0;
        }
        input[type="text"] {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .btn-add {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: filter 0.15s ease;
        }
        .btn-add:hover {
            filter: brightness(1.1);
        }
        .filter-row {
            display: flex;
            gap: 0.25rem;
            background: #1e293b;
            padding: 0.25rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .filter-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 0.4rem;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #334155;
            color: #38bdf8;
        }
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 280px;
            overflow-y: auto;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: #1e293b;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .todo-text {
            cursor: pointer;
            flex: 1;
            margin-left: 0.5rem;
            font-size: 0.95rem;
            user-select: none;
        }
        .todo-done {
            text-decoration: line-through;
            color: #64748b;
        }
        .del-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            padding: 0.25rem 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 0.25rem;
        }
        .del-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        .footer-stats {
            margin-top: 1.25rem;
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { state, computed, input, button, ul, li, div, h2, span, mount } from '../src/index.js';

        let nextId = 3;
        const todos = state([
            { id: 1, text: "Learn Cairn signals", done: true },
            { id: 2, text: "Build lightweight UI widgets", done: false }
        ]);
        const inputText = state("");
        const filter = state("all"); // "all" | "active" | "completed"

        const filteredTodos = computed(() => {
            if (filter.value === "active") return todos.value.filter(t => !t.done);
            if (filter.value === "completed") return todos.value.filter(t => t.done);
            return todos.value;
        });

        const remainingCount = computed(() => todos.value.filter(t => !t.done).length);

        const addTodo = () => {
            const val = inputText.value.trim();
            if (!val) return;
            todos.value = [...todos.value, { id: nextId++, text: val, done: false }];
            inputText.value = "";
        };

        const toggleTodo = (id) => {
            todos.value = todos.value.map(t => t.id === id ? { ...t, done: !t.done } : t);
        };

        const removeTodo = (id) => {
            todos.value = todos.value.filter(t => t.id !== id);
        };

        const App = div({ class: 'todo-card' },
            h2("Tasks & Todos"),
            div({ class: 'input-row' },
                input({
                    type: 'text',
                    placeholder: 'Add new task...',
                    value: inputText,
                    oninput: (e) => inputText.value = e.target.value,
                    onkeydown: (e) => { if (e.key === 'Enter') addTodo(); }
                }),
                button('Add', { class: 'btn-add', onclick: addTodo })
            ),
            div({ class: 'filter-row' },
                button('All', {
                    class: () => `filter-btn ${filter.value === 'all' ? 'active' : ''}`,
                    onclick: () => filter.value = 'all'
                }),
                button('Active', {
                    class: () => `filter-btn ${filter.value === 'active' ? 'active' : ''}`,
                    onclick: () => filter.value = 'active'
                }),
                button('Done', {
                    class: () => `filter-btn ${filter.value === 'completed' ? 'active' : ''}`,
                    onclick: () => filter.value = 'completed'
                })
            ),
            ul(() => filteredTodos.value.map(todo =>
                li({ key: todo.id },
                    input({
                        type: 'checkbox',
                        checked: todo.done,
                        onchange: () => toggleTodo(todo.id)
                    }),
                    span(todo.text, {
                        class: `todo-text ${todo.done ? 'todo-done' : ''}`,
                        onclick: () => toggleTodo(todo.id)
                    }),
                    button('×', {
                        class: 'del-btn',
                        title: 'Delete',
                        onclick: () => removeTodo(todo.id)
                    })
                )
            )),
            div({ class: 'footer-stats' },
                span(() => `${remainingCount.value} items remaining`),
                button('Clear Done', {
                    style: { background: 'transparent', border: 'none', color: '#94a3b8', cursor: 'pointer', fontSize: '0.8rem' },
                    onclick: () => { todos.value = todos.value.filter(t => !t.done); }
                })
            )
        );

        mount("#app", App);
    </script>
</body>
</html>
