<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CairnJS — Svelte Action Integration Bridge</title>
    <meta name="description" content="Mount CairnJS reactive widgets directly on any DOM node using Svelte custom actions.">
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="../../docs/assets/cairn-official-logo.svg">
    <link rel="alternate icon" type="image/png" href="../../docs/assets/cairn-official-logo.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root, [data-theme="dark"] {
            --bg: #090d16;
            --surface: #0e131f;
            --surface-card: #121826;
            --surface-hover: #1a2234;
            --border: #1e2638;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ff3e00;
            --accent-sky: #38bdf8;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --accent: #ea580c;
            --accent-sky: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* Header */
        header {
            height: 58px;
            background: var(--header-bg, rgba(9, 13, 22, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--text);
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Centered Desktop Nav */
        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 1.65rem;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.15s ease;
            cursor: pointer;
            padding: 0.25rem 0.25rem;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent-sky);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-get-started {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border: none;
            padding: 0.4rem 0.85rem;
            border-radius: 0.5rem;
            font-size: 0.825rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
            transition: all 0.15s ease;
        }

        .btn-get-started:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            border-color: var(--accent-sky);
            color: var(--accent-sky);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .container {
            max-width: 580px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .svelte-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 62, 0, 0.12);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 62, 0, 0.25);
        }

        .cairn-slot {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: var(--surface);
            border: 1.5px dashed var(--border);
            border-radius: 0.75rem;
        }

        @media (max-width: 840px) {
            .desktop-nav { display: none; }
        }
    </style>
</head>

<body>
    <!-- Top Header -->
    <header>
        <!-- Left: Brand Logo + Wordmark -->
        <a href="../../docs/index.html" class="brand">
            <img src="../../docs/assets/cairn-official-logo.png" alt="CairnJS"
                style="width: 28px; height: 28px; object-fit: contain;"
                onerror="this.src='../../docs/assets/cairn-logo.png'">
            <span>CairnJS</span>
        </a>

        <!-- Center: Centered Desktop Nav Links -->
        <nav class="desktop-nav">
            <a href="../../docs/index.html#/docs/getting-started" class="nav-link">Docs</a>
            <a href="../../docs/index.html#/docs/fundamentals" class="nav-link">Guide</a>
            <a href="../index.html" class="nav-link active">Examples</a>
            <a href="../../docs/playground.html" class="nav-link">Playground</a>
        </nav>

        <!-- Right Controls: [Get Started →] + Theme Toggle + GitHub -->
        <div class="header-actions">
            <a href="../../docs/index.html#/docs/getting-started" class="btn-get-started">Get Started →</a>
            <button id="theme-btn" class="icon-btn" title="Toggle Theme" onclick="toggleTheme()" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="https://github.com/EldrexDelosReyesBula/CairnJS" target="_blank" rel="noreferrer" class="icon-btn" aria-label="GitHub Repository">
                <i class="fa-brands fa-github"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="svelte-card">
                <span class="badge"><i class="fa-solid fa-fire"></i> Svelte Action + CairnJS Island</span>
                <h1 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 0.5rem; font-family: var(--font-heading);">Svelte `use:cairn` Action Bridge</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.25rem;">
                    Using Svelte custom actions (<code style="color: var(--accent);">use:action</code>), CairnJS mounts zero-dependency reactive widgets directly onto any DOM node with automatic lifecycle teardown.
                </p>

                <div id="svelte-host" class="cairn-slot"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { cairn, component, state, computed, div, h3, p, button, mount } from '../../src/index.js';

        window.toggleTheme = function() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('cairn_theme', next);
            const icon = document.querySelector('#theme-btn i');
            if (icon) icon.className = next === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        };
        const saved = localStorage.getItem('cairn_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        const icon = document.querySelector('#theme-btn i');
        if (icon) icon.className = saved === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';

        // 1. Svelte Action Implementation for Cairn
        function cairnAction(node, { componentFn, props }) {
            let unmount = mount(node, componentFn(props));

            return {
                update(newOptions) {
                    if (unmount) unmount();
                    unmount = mount(node, newOptions.componentFn(newOptions.props));
                },
                destroy() {
                    if (unmount) unmount();
                }
            };
        }

        // 2. Cairn Micro Widget
        const ServerMonitorWidget = component(({ initialLoad = 45 }) => {
            const load = state(initialLoad);
            const status = computed(() => load.value > 80 ? 'CRITICAL 🔥' : load.value > 50 ? 'ELEVATED ⚠️' : 'OPTIMAL 🟢');

            return div({ style: { display: 'flex', flexDirection: 'column', gap: '0.75rem' } },
                h3({ style: { fontSize: '0.95rem', color: 'var(--accent)', display: 'flex', alignItems: 'center', gap: '0.4rem' } },
                    '⚡ Cairn Island: Server Memory Cluster'
                ),
                div({ style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                    p(() => `Utilization: ${load.value}%`, { style: { fontSize: '1.2rem', fontWeight: '800', color: 'var(--text)' } }),
                    p(() => status.value, { style: { fontSize: '0.8rem', fontWeight: '700', color: 'var(--accent)' } })
                ),
                div({ style: { width: '100%', height: '8px', background: 'rgba(255,255,255,0.1)', borderRadius: '9999px', overflow: 'hidden' } },
                    div({
                        style: () => ({
                            width: `${Math.min(100, Math.max(0, load.value))}%`,
                            height: '100%',
                            background: load.value > 80 ? '#ef4444' : load.value > 50 ? '#f59e0b' : '#10b981',
                            transition: 'all 0.25s ease'
                        })
                    })
                ),
                div({ style: { display: 'flex', gap: '0.5rem', marginTop: '0.25rem' } },
                    button('Simulate Spike (+15%)', {
                        style: {
                            background: '#ea580c',
                            color: 'white',
                            border: 'none',
                            padding: '0.5rem 0.85rem',
                            borderRadius: '0.375rem',
                            cursor: 'pointer',
                            fontWeight: '700',
                            fontSize: '0.8rem'
                        },
                        onclick: () => load.value = Math.min(100, load.value + 15)
                    }),
                    button('Cool Down (-15%)', {
                        style: {
                            background: 'transparent',
                            color: 'var(--text-muted)',
                            border: '1px solid var(--border)',
                            padding: '0.5rem 0.85rem',
                            borderRadius: '0.375rem',
                            cursor: 'pointer',
                            fontSize: '0.8rem'
                        },
                        onclick: () => load.value = Math.max(5, load.value - 15)
                    })
                )
            );
        });

        // 3. Mount using Svelte Action Bridge pattern
        const host = document.getElementById('svelte-host');
        cairnAction(host, { componentFn: ServerMonitorWidget, props: { initialLoad: 55 } });
    </script>
</body>

</html>
