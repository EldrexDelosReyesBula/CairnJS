<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CairnJS — React 18 / 19 Integration Bridge</title>
    <meta name="description" content="Bi-directional reactive bridge connecting React parent states and Cairn high-frequency signals.">
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="../../docs/assets/cairn-official-logo.svg">
    <link rel="alternate icon" type="image/png" href="../../docs/assets/cairn-official-logo.png">
    
    <!-- React 18 UMD Bundles -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root, [data-theme="dark"] {
            --bg: #090d16;
            --surface: #0e131f;
            --surface-card: #121826;
            --surface-hover: #1a2234;
            --border: #1e2638;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* Header */
        header {
            height: 58px;
            background: var(--header-bg, rgba(9, 13, 22, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--text);
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Centered Desktop Nav */
        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 1.65rem;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.15s ease;
            cursor: pointer;
            padding: 0.25rem 0.25rem;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-get-started {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border: none;
            padding: 0.4rem 0.85rem;
            border-radius: 0.5rem;
            font-size: 0.825rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
            transition: all 0.15s ease;
        }

        .btn-get-started:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .container {
            max-width: 580px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .react-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .cairn-slot {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: var(--surface);
            border: 1.5px dashed var(--border);
            border-radius: 0.75rem;
        }

        @media (max-width: 840px) {
            .desktop-nav { display: none; }
        }
    </style>
</head>

<body>
    <!-- Top Header -->
    <header>
        <!-- Left: Brand Logo + Wordmark -->
        <a href="../../docs/index.html" class="brand">
            <img src="../../docs/assets/cairn-official-logo.png" alt="CairnJS"
                style="width: 28px; height: 28px; object-fit: contain;"
                onerror="this.src='../../docs/assets/cairn-logo.png'">
            <span>CairnJS</span>
        </a>

        <!-- Center: Centered Desktop Nav Links -->
        <nav class="desktop-nav">
            <a href="../../docs/index.html#/docs/getting-started" class="nav-link">Docs</a>
            <a href="../../docs/index.html#/docs/fundamentals" class="nav-link">Guide</a>
            <a href="../index.html" class="nav-link active">Examples</a>
            <a href="../../docs/playground.html" class="nav-link">Playground</a>
        </nav>

        <!-- Right Controls: [Get Started →] + Theme Toggle + GitHub -->
        <div class="header-actions">
            <a href="../../docs/index.html#/docs/getting-started" class="btn-get-started">Get Started →</a>
            <button id="theme-btn" class="icon-btn" title="Toggle Theme" onclick="toggleTheme()" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="https://github.com/EldrexDelosReyesBula/CairnJS" target="_blank" rel="noreferrer" class="icon-btn" aria-label="GitHub Repository">
                <i class="fa-brands fa-github"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div id="root"></div>
        </div>
    </main>

    <script type="module">
        import { cairn, component, state, computed, div, h3, p, button, mount } from '../../src/index.js';

        window.toggleTheme = function() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('cairn_theme', next);
            const icon = document.querySelector('#theme-btn i');
            if (icon) icon.className = next === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        };
        const saved = localStorage.getItem('cairn_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        const icon = document.querySelector('#theme-btn i');
        if (icon) icon.className = saved === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';

        const { useState, useEffect, useRef, createElement: h } = React;

        // 1. Pure Cairn Reactive Widget Island
        const CairnMicroCounter = component(({ initialValue = 0, onScoreChange }) => {
            const count = state(initialValue);
            const double = computed(() => count.value * 2);

            return div({ style: { display: 'flex', flexDirection: 'column', gap: '0.6rem' } },
                h3({ style: { fontSize: '0.95rem', color: 'var(--accent)', display: 'flex', alignItems: 'center', gap: '0.4rem' } },
                    '⚡ Cairn Reactive Sub-Tree (Zero Virtual DOM)'
                ),
                p({ style: { color: 'var(--text-muted)', fontSize: '0.825rem' } }, 'State updates execute directly on the DOM node with surgical signal subscriptions.'),
                
                div({ style: { display: 'flex', alignItems: 'center', gap: '1rem', marginTop: '0.25rem' } },
                    p(() => `Cairn Signal: ${count.value}`, { style: { fontSize: '1.15rem', fontWeight: '800', color: 'var(--text)' } }),
                    p(() => `(Double: ${double.value})`, { style: { fontSize: '0.85rem', color: '#818cf8', fontWeight: '600' } })
                ),

                div({ style: { display: 'flex', gap: '0.5rem', marginTop: '0.25rem' } },
                    button('+1 Signal', {
                        style: {
                            background: '#0284c7',
                            color: '#fff',
                            border: 'none',
                            padding: '0.5rem 0.85rem',
                            borderRadius: '0.375rem',
                            cursor: 'pointer',
                            fontWeight: '700',
                            fontSize: '0.8rem'
                        },
                        onclick: () => {
                            count.value++;
                            if (typeof onScoreChange === 'function') onScoreChange(count.value);
                        }
                    }),
                    button('Reset', {
                        style: {
                            background: 'transparent',
                            color: 'var(--text-muted)',
                            border: '1px solid var(--border)',
                            padding: '0.5rem 0.85rem',
                            borderRadius: '0.375rem',
                            cursor: 'pointer',
                            fontSize: '0.8rem'
                        },
                        onclick: () => {
                            count.value = 0;
                            if (typeof onScoreChange === 'function') onScoreChange(0);
                        }
                    })
                )
            );
        });

        // 2. React Host Shell Application
        function ReactApp() {
            const [reactState, setReactState] = useState(10);
            const [childScore, setChildScore] = useState(0);
            const slotRef = useRef(null);

            useEffect(() => {
                if (slotRef.current) {
                    const unmount = mount(slotRef.current, CairnMicroCounter({
                        initialValue: 5,
                        onScoreChange: (v) => setChildScore(v)
                    }));
                    return unmount;
                }
            }, []);

            return h('div', { className: 'react-card' },
                h('span', { className: 'badge' }, 
                    h('i', { className: 'fa-brands fa-react' }),
                    'React 18 Host + CairnJS Island'
                ),
                h('h1', { style: { fontSize: '1.35rem', fontWeight: 800, marginBottom: '0.5rem' } }, 'Bi-Directional React Interop'),
                h('p', { style: { color: 'var(--text-muted)', fontSize: '0.875rem', lineHeight: '1.5', marginBottom: '1.25rem' } },
                    'React manages parent lifecycle & server rendering, while Cairn mounts high-frequency 60fps islands without Virtual DOM overhead.'
                ),
                
                h('div', { style: { display: 'flex', gap: '0.75rem', alignItems: 'center', marginBottom: '0.5rem' } },
                    h('button', {
                        style: {
                            background: 'var(--surface)',
                            color: 'var(--text)',
                            border: '1px solid var(--border)',
                            padding: '0.55rem 1rem',
                            borderRadius: '0.5rem',
                            cursor: 'pointer',
                            fontWeight: 600,
                            fontSize: '0.85rem'
                        },
                        onClick: () => setReactState(c => c + 1)
                    }, `React State: ${reactState}`),
                    h('span', { style: { fontSize: '0.825rem', color: 'var(--accent)' } }, `Cairn Reported: ${childScore}`)
                ),

                h('div', { ref: slotRef, className: 'cairn-slot' })
            );
        }

        // Mount React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(ReactApp));
    </script>
</body>

</html>
