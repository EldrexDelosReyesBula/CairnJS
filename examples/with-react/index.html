<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CairnJS — React 18 / 19 Integration Example</title>
    <!-- React 18 Production UMD Bundles for 100% Guaranteed Execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 520px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .react-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .react-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .cairn-slot {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: #0f172a;
            border: 1.5px dashed rgba(56, 189, 248, 0.5);
            border-radius: 0.85rem;
        }
        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .back-nav:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../docs/index.html" class="back-nav"><i class="fa-solid fa-arrow-left"></i> Back to CairnJS Docs</a>
        <div id="root"></div>
    </div>

    <script type="module">
        import { cairn, component, state, computed, div, h3, p, button, mount, cairnToReact } from '../../src/index.js';

        const { useState, useEffect, useRef, createElement: h } = React;

        // 1. Native Pure Cairn Reactive Widget
        const CairnMicroCounter = component(({ initialValue = 0, onScoreChange }) => {
            const count = state(initialValue);
            const double = computed(() => count.value * 2);

            return div({ style: { display: 'flex', flexDirection: 'column', gap: '0.6rem' } },
                h3({ style: { fontSize: '0.95rem', color: '#38bdf8', display: 'flex', alignItems: 'center', gap: '0.4rem' } },
                    '⚡ Cairn Reactive Sub-tree (0 Dependencies)'
                ),
                p({ style: { color: '#94a3b8', fontSize: '0.825rem' } }, 'State updates execute directly on the DOM node without virtual reconciliation.'),
                
                div({ style: { display: 'flex', alignItems: 'center', gap: '1rem', marginTop: '0.25rem' } },
                    p(() => `Cairn Signal: ${count.value}`, { style: { fontSize: '1.2rem', fontWeight: '800', color: '#f8fafc' } }),
                    p(() => `(Double: ${double.value})`, { style: { fontSize: '0.85rem', color: '#818cf8', fontWeight: '600' } })
                ),

                div({ style: { display: 'flex', gap: '0.5rem', marginTop: '0.25rem' } },
                    button('+1 Signal', {
                        style: {
                            background: 'linear-gradient(135deg, #0284c7, #38bdf8)',
                            color: '#fff',
                            border: 'none',
                            padding: '0.5rem 0.85rem',
                            borderRadius: '0.375rem',
                            cursor: 'pointer',
                            fontWeight: '700',
                            fontSize: '0.8rem'
                        },
                        onclick: () => {
                            count.value++;
                            if (typeof onScoreChange === 'function') onScoreChange(count.value);
                        }
                    }),
                    button('Reset', {
                        style: {
                            background: '#1e293b',
                            color: '#94a3b8',
                            border: '1px solid rgba(255,255,255,0.1)',
                            padding: '0.5rem 0.85rem',
                            borderRadius: '0.375rem',
                            cursor: 'pointer',
                            fontSize: '0.8rem'
                        },
                        onclick: () => {
                            count.value = 0;
                            if (typeof onScoreChange === 'function') onScoreChange(0);
                        }
                    })
                )
            );
        });

        // 2. React Host Shell Application
        function ReactApp() {
            const [reactState, setReactState] = useState(10);
            const [childScore, setChildScore] = useState(0);
            const slotRef = useRef(null);

            useEffect(() => {
                if (slotRef.current) {
                    const unmount = mount(slotRef.current, CairnMicroCounter({
                        initialValue: 5,
                        onScoreChange: (v) => setChildScore(v)
                    }));
                    return unmount;
                }
            }, []);

            return h('div', { className: 'react-card' },
                h('span', { className: 'react-badge' }, 
                    h('i', { className: 'fa-brands fa-react' }),
                    'React 18 Host + CairnJS Island'
                ),
                h('h1', { style: { fontSize: '1.4rem', fontWeight: 800, marginBottom: '0.5rem' } }, 'Bi-Directional React Interop'),
                h('p', { style: { color: '#94a3b8', fontSize: '0.875rem', lineHeight: '1.5', marginBottom: '1.25rem' } },
                    'React manages parent lifecycle & server rendering, while Cairn mounts high-frequency 60fps islands without Virtual DOM overhead.'
                ),
                
                h('div', { style: { display: 'flex', gap: '0.75rem', alignItems: 'center', marginBottom: '0.5rem' } },
                    h('button', {
                        style: {
                            background: '#334155',
                            color: '#f8fafc',
                            border: '1px solid rgba(255,255,255,0.1)',
                            padding: '0.55rem 1rem',
                            borderRadius: '0.5rem',
                            cursor: 'pointer',
                            fontWeight: 600,
                            fontSize: '0.85rem'
                        },
                        onClick: () => setReactState(c => c + 1)
                    }, `React State: ${reactState}`),
                    h('span', { style: { fontSize: '0.8rem', color: '#38bdf8' } }, `Cairn Reported: ${childScore}`)
                ),

                h('div', { ref: slotRef, className: 'cairn-slot' })
            );
        }

        // Mount React 18 Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(ReactApp));
    </script>
</body>
</html>
